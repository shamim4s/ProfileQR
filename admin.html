<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Card Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container generator">

    <h1>Personal QR Card Generator</h1>

    <div class="notice">
        This generator works locally in your browser.
        Your information is not sent to a server.
    </div>

    <div class="generator-grid">

        <!-- FORM -->

        <div class="card">

            <h2>Contact Information</h2>

            <div class="form-group">
                <label>Profile ID / Slug</label>

                <input
                    id="slug"
                    placeholder="john"
                >
            </div>

            <div class="form-group">
                <label>Name *</label>

                <input
                    id="name"
                    placeholder="John Smith"
                >
            </div>

            <div class="form-group">
                <label>Job / Designation</label>

                <input
                    id="jobTitle"
                    placeholder="Business Consultant"
                >
            </div>

            <div class="form-group">
                <label>Phone</label>

                <input
                    id="phone"
                    placeholder="+880..."
                >
            </div>

            <div class="form-group">
                <label>Mobile</label>

                <input
                    id="mobile"
                    placeholder="+880..."
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="name@example.com"
                >
            </div>

            <div class="form-group">
                <label>Address 01</label>

                <input
                    id="address1"
                    placeholder="House / Street"
                >
            </div>

            <div class="form-group">
                <label>Address 02</label>

                <input
                    id="address2"
                    placeholder="City / Country"
                >
            </div>

            <div class="form-group">
                <label>Website</label>

                <input
                    id="website"
                    placeholder="https://example.com"
                >
            </div>

            <div class="form-group">
                <label>Profile URL</label>

                <input
                    id="profileUrl"
                    placeholder="https://username.github.io/profile.html?id=john"
                >
            </div>

            <div class="form-group">
                <label>About / Extra</label>

                <textarea
                    id="about"
                    placeholder="Short description..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Extra 01</label>

                <input id="extra1">
            </div>

            <div class="form-group">
                <label>Extra 02</label>

                <input id="extra2">
            </div>

            <div class="form-group">
                <label>Profile Picture</label>

                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >
            </div>

            <button
                class="btn primary"
                id="generate"
                style="width:100%"
            >
                Generate QR & Files
            </button>

        </div>


        <!-- PREVIEW -->

        <div class="card preview">

            <h2>Preview</h2>

            <img
                id="previewPhoto"
                class="profile-photo"
                src=""
                alt="Profile"
            >

            <h2 id="previewName">
                Your Name
            </h2>

            <p id="previewJob">
                Your designation
            </p>

            <div
                id="qrcode"
                class="qr-box"
            >
                <span>
                    QR will appear here
                </span>
            </div>

            <div class="button-grid">

                <button
                    id="downloadQR"
                    class="btn primary"
                >
                    Download QR
                </button>

                <button
                    id="downloadVCF"
                    class="btn success"
                >
                    Download vCard
                </button>

                <button
                    id="downloadJSON"
                    class="btn dark"
                >
                    Download JSON
                </button>

                <button
                    id="copyURL"
                    class="btn secondary"
                >
                    Copy Profile URL
                </button>

            </div>

            <h3>QR Payload</h3>

            <div
                id="vcardPreview"
                class="code-box"
            >
                Generate a profile first.
            </div>

        </div>

    </div>

</div>


<!-- IMPORTANT:
     This file MUST be stored locally.
-->

<script src="lib/qrcode.min.js"></script>

<script>

let currentProfile = null;
let currentVCard = "";

const $ = id => document.getElementById(id);


// -----------------------------------------------------
// Escape vCard values
// -----------------------------------------------------

function escapeVCard(value) {

    if (!value) return "";

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}


// -----------------------------------------------------
// Create vCard
// -----------------------------------------------------

function createVCard(profile) {

    const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",

        `FN:${escapeVCard(profile.name)}`,

        profile.jobTitle
            ? `TITLE:${escapeVCard(profile.jobTitle)}`
            : "",

        profile.phone
            ? `TEL;TYPE=VOICE:${escapeVCard(profile.phone)}`
            : "",

        profile.mobile
            ? `TEL;TYPE=CELL:${escapeVCard(profile.mobile)}`
            : "",

        profile.email
            ? `EMAIL:${escapeVCard(profile.email)}`
            : "",

        profile.address1 || profile.address2
            ? `ADR;TYPE=HOME:;;${escapeVCard(profile.address1)};${escapeVCard(profile.address2)};;;`
            : "",

        profile.website
            ? `URL:${escapeVCard(profile.website)}`
            : "",

        profile.profileUrl
            ? `X-SOCIALPROFILE;TYPE=profile:${escapeVCard(profile.profileUrl)}`
            : "",

        profile.about
            ? `NOTE:${escapeVCard(profile.about)}`
            : "",

        profile.extra1
            ? `NOTE:${escapeVCard(profile.extra1)}`
            : "",

        profile.extra2
            ? `NOTE:${escapeVCard(profile.extra2)}`
            : "",

        "END:VCARD"
    ];

    return lines
        .filter(Boolean)
        .join("\r\n");
}


// -----------------------------------------------------
// Read photo
// -----------------------------------------------------

function readPhoto(file) {

    return new Promise((resolve, reject) => {

        if (!file) {
            resolve("");
            return;
        }

        const reader = new FileReader();

        reader.onload = () => {

            const image = new Image();

            image.onload = () => {

                // Resize photo so JSON doesn't become huge.

                const maxSize = 600;

                let width = image.width;
                let height = image.height;

                if (width > height) {

                    if (width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    }

                } else {

                    if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }
                }

                const canvas =
                    document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        0.82
                    )
                );
            };

            image.onerror = reject;

            image.src = reader.result;
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


// -----------------------------------------------------
// Download file
// -----------------------------------------------------

function downloadFile(
    filename,
    content,
    mime
) {

    const blob = new Blob(
        [content],
        { type: mime }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 1000);
}


// -----------------------------------------------------
// Generate QR
// -----------------------------------------------------

function generateQR(payload) {

    const container =
        $("qrcode");

    container.innerHTML = "";

    /*
       qrcode-generator library API
    */

    const qr =
        qrcode(0, "M");

    qr.addData(payload);

    qr.make();

    const img =
        document.createElement("img");

    img.src =
        qr.createDataURL(
            8,
            0
        );

    img.alt = "Contact QR Code";

    container.appendChild(img);
}


// -----------------------------------------------------
// Generate
// -----------------------------------------------------

$("generate").addEventListener(
    "click",
    async () => {

        const name =
            $("name").value.trim();

        const slug =
            $("slug").value.trim()
                .toLowerCase()
                .replace(/[^a-z0-9-_]/g, "-");

        if (!name) {

            alert("Please enter a name.");

            return;
        }

        if (!slug) {

            alert("Please enter a profile ID.");

            return;
        }

        const photo =
            await readPhoto(
                $("photo").files[0]
            );

        const profile = {

            id: slug,

            name,

            jobTitle:
                $("jobTitle").value.trim(),

            phone:
                $("phone").value.trim(),

            mobile:
                $("mobile").value.trim(),

            email:
                $("email").value.trim(),

            address1:
                $("address1").value.trim(),

            address2:
                $("address2").value.trim(),

            website:
                $("website").value.trim(),

            profileUrl:
                $("profileUrl").value.trim(),

            about:
                $("about").value.trim(),

            extra1:
                $("extra1").value.trim(),

            extra2:
                $("extra2").value.trim(),

            photo
        };


        currentProfile = profile;

        currentVCard =
            createVCard(profile);


        // Preview

        $("previewName").textContent =
            profile.name;

        $("previewJob").textContent =
            profile.jobTitle || "";


        if (profile.photo) {

            $("previewPhoto").src =
                profile.photo;

        }


        // QR contains vCard itself.

        generateQR(currentVCard);


        // Show vCard

        $("vcardPreview").textContent =
            currentVCard;


        // Save locally in browser too.

        localStorage.setItem(
            "profile-" + profile.id,
            JSON.stringify(profile)
        );

        alert(
            "Profile generated successfully."
        );
    }
);


// -----------------------------------------------------
// Download QR image
// -----------------------------------------------------

$("downloadQR").addEventListener(
    "click",
    () => {

        if (!currentProfile) {

            alert(
                "Generate the profile first."
            );

            return;
        }

        const image =
            $("qrcode").querySelector("img");

        if (!image) return;

        const a =
            document.createElement("a");

        a.href =
            image.src;

        a.download =
            currentProfile.id +
            "-contact-qr.png";

        a.click();
    }
);


// -----------------------------------------------------
// Download VCF
// -----------------------------------------------------

$("downloadVCF").addEventListener(
    "click",
    () => {

        if (!currentProfile) {

            alert(
                "Generate the profile first."
            );

            return;
        }

        downloadFile(
            currentProfile.id +
                ".vcf",

            currentVCard,

            "text/vcard;charset=utf-8"
        );
    }
);


// -----------------------------------------------------
// Download JSON
// -----------------------------------------------------

$("downloadJSON").addEventListener(
    "click",
    () => {

        if (!currentProfile) {

            alert(
                "Generate the profile first."
            );

            return;
        }

        downloadFile(

            currentProfile.id +
                ".json",

            JSON.stringify(
                currentProfile,
                null,
                2
            ),

            "application/json"
        );
    }
);


// -----------------------------------------------------
// Copy URL
// -----------------------------------------------------

$("copyURL").addEventListener(
    "click",
    async () => {

        if (!currentProfile) {

            alert(
                "Generate the profile first."
            );

            return;
        }

        const url =
            $("profileUrl").value.trim();

        if (!url) {

            alert(
                "Enter your profile URL first."
            );

            return;
        }

        await navigator.clipboard.writeText(url);

        alert(
            "Profile URL copied."
        );
    }
);

</script>

</body>
</html>
