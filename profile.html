<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Profile AAA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div class="loading">Loading profile...</div>
</div>

<script>
"use strict";

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeVCard(value) {
    if (!value) return "";
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}

function normalizeWebsite(value){const v=String(value||"").trim();return !v?"":(/^https?:\/\//i.test(v)?v:"https://"+v);}

function createVCard(profile) {
    const photo=profile.photo ? `PHOTO;ENCODING=b;TYPE=JPEG:${String(profile.photo).split(",")[1]}` : "";
    return ["BEGIN:VCARD","VERSION:3.0",`FN:${escapeVCard(profile.name)}`,profile.jobTitle?`TITLE:${escapeVCard(profile.jobTitle)}`:"",profile.phone?`TEL;TYPE=VOICE:${escapeVCard(profile.phone)}`:"",profile.mobile?`TEL;TYPE=CELL:${escapeVCard(profile.mobile)}`:"",profile.email?`EMAIL:${escapeVCard(profile.email)}`:"",profile.address1||profile.address2?`ADR;TYPE=HOME:;;${escapeVCard(profile.address1)};${escapeVCard(profile.address2)};;;`:"",profile.website?`URL:${escapeVCard(normalizeWebsite(profile.website))}`:"",profile.profileUrl?`X-SOCIALPROFILE;TYPE=profile:${escapeVCard(profile.profileUrl)}`:"",profile.about?`NOTE:${escapeVCard(profile.about)}`:"",profile.extra1?`X-EXTRA-01:${escapeVCard(profile.extra1)}`:"",profile.extra2?`X-EXTRA-02:${escapeVCard(profile.extra2)}`:"",photo,"END:VCARD"].filter(Boolean).join("\r\n");
}

function saveContact(profile) {
    const blob = new Blob([createVCard(profile)], {
        type: "text/vcard;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = profile.id + "-contact.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadProfile() {
    if (!id) throw new Error("No profile ID was supplied.");

    const safeId = encodeURIComponent(id);
    const urls = [
        `profiles/${safeId}/profile.json`,
        `profiles/${safeId}.json`
    ];

    for (const url of urls) {
        const response = await fetch(url, { cache: "no-store" });
        if (response.ok) return response.json();
    }

    throw new Error("Profile not found.");
}

function renderProfile(profile) {
    document.title = profile.name || "Contact Profile";

    const phoneLink = profile.phone
        ? `<div class="contact-row"><span>📞</span><a href="tel:${escapeHTML(profile.phone)}">${escapeHTML(profile.phone)}</a></div>`
        : "";

    const mobileLink = profile.mobile
        ? `<div class="contact-row"><span>📱</span><a href="tel:${escapeHTML(profile.mobile)}">${escapeHTML(profile.mobile)}</a></div>`
        : "";

    const emailLink = profile.email
        ? `<div class="contact-row"><span>✉️</span><a href="mailto:${escapeHTML(profile.email)}">${escapeHTML(profile.email)}</a></div>`
        : "";

    const websiteLink = profile.website
        ? `<div class="contact-row"><span>🌐</span><a href="${escapeHTML(normalizeWebsite(profile.website))}" target="_blank" rel="noopener">Website</a></div>`
        : "";

    const address = profile.address1 || profile.address2
        ? `<section class="profile-section"><h3>Address</h3><div>${escapeHTML(profile.address1)}</div><div>${escapeHTML(profile.address2)}</div></section>`
        : "";

    const about = profile.about
        ? `<section class="profile-section"><h3>About</h3><p>${escapeHTML(profile.about)}</p></section>`
        : "";

    const extras = profile.extra1 || profile.extra2
        ? `<section class="profile-section"><h3>More Information</h3><div>${escapeHTML(profile.extra1)}</div><div>${escapeHTML(profile.extra2)}</div></section>`
        : "";

    app.innerHTML = `
        <div class="profile-page">
            <main class="profile">
                <div class="profile-badge">DIGITAL CONTACT</div>

                ${
                    profile.photo
                        ? `<img class="profile-avatar" src="${profile.photo}" alt="${escapeHTML(profile.name)}">`
                        : `<div class="profile-avatar profile-avatar-placeholder">${escapeHTML((profile.name || "?").charAt(0).toUpperCase())}</div>`
                }

                <h1>${escapeHTML(profile.name)}</h1>
                <div class="title">${escapeHTML(profile.jobTitle)}</div>

                ${
                    profile.about
                        ? `<p class="about">${escapeHTML(profile.about)}</p>`
                        : ""
                }

                <div class="profile-actions">
                    <button id="saveContact" class="btn success">💾 Save Contact</button>

                    ${
                        profile.phone
                            ? `<a class="btn primary" href="tel:${escapeHTML(profile.phone)}">📞 Call</a>`
                            : ""
                    }

                    ${
                        profile.mobile
                            ? `<a class="btn primary" href="tel:${escapeHTML(profile.mobile)}">📱 Mobile</a>`
                            : ""
                    }

                    ${
                        profile.email
                            ? `<a class="btn secondary" href="mailto:${escapeHTML(profile.email)}">✉️ Email</a>`
                            : ""
                    }

                    ${
                        profile.website
                            ? `<a class="btn dark" href="${escapeHTML(normalizeWebsite(profile.website))}" target="_blank" rel="noopener">🌐 Website</a>`
                            : ""
                    }
                </div>

                <section class="profile-section">
                    <h3>Contact</h3>
                    ${phoneLink}
                    ${mobileLink}
                    ${emailLink}
                    ${websiteLink}
                </section>

                ${address}
                ${extras}

                <div class="profile-footer">Powered by ProfileQR</div>
            </main>
        </div>
    `;

    document.getElementById("saveContact").addEventListener("click", () => saveContact(profile));
}

async function render() {
    try {
        renderProfile(await loadProfile());
    } catch (error) {
        app.innerHTML = `
            <div class="error">
                <h2>Profile unavailable</h2>
                <p>${escapeHTML(error.message)}</p>
            </div>
        `;
    }
}

render();
</script>
</body>
</html>
