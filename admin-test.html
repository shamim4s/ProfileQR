<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Token Client-Side Encryption Test</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #f9f9f9; }
    input[type="password"], input[type="text"] { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
    button { background: #0066cc; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
    .status { padding: 10px; margin-top: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; display: block; }
    .error { background: #f8d7da; color: #721c24; display: block; }
    code { background: #eee; padding: 2px 4px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <h2>GitHub Admin Token Manager</h2>

  <!-- SECTION 1: FIRST TIME SETUP -->
  <div class="card">
    <h3>1. First-Time Setup (Encrypt Token)</h3>
    <p>Use this section to securely encrypt your GitHub token with a password.</p>
    
    <label for="setupToken">GitHub Personal Access Token:</label>
    <input type="password" id="setupToken" placeholder="github_pat_... or ghp_...">

    <label for="setupPassword">Choose an Admin Password:</label>
    <input type="password" id="setupPassword" placeholder="Enter a secure password">

    <button onclick="handleEncryptAndSave()">Encrypt & Save Token</button>
    <div id="setupStatus" class="status"></div>
  </div>

  <!-- SECTION 2: ADMIN LOGIN -->
  <div class="card">
    <h3>2. Admin Actions (Decrypt & Use Token)</h3>
    <p>Enter your password to decrypt the token and authenticate with GitHub.</p>

    <label for="loginPassword">Admin Password:</label>
    <input type="password" id="loginPassword" placeholder="Enter your admin password">

    <button onclick="handleLoginAndTest()">Login & Test GitHub Token</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <script>
    // --- CRYPTOGRAPHY HELPER FUNCTIONS (Web Crypto API) ---

    // Encrypts plain text string using AES-GCM with a PBKDF2 derived key
    async function encryptData(plainText, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      
      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );

      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv }, key, enc.encode(plainText)
      );

      return {
        salt: Array.from(salt),
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      };
    }

    // Decrypts encrypted payload object using the provided password
    async function decryptData(payload, password) {
      const dec = new TextDecoder();
      const salt = new Uint8Array(payload.salt);
      const iv = new Uint8Array(payload.iv);
      const data = new Uint8Array(payload.data);

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
      );
      
      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv }, key, data
      );
      
      return dec.decode(decrypted);
    }

    // --- APPLICATION LOGIC ---

    // Session storage for active decrypted token (exists only in browser memory)
    let activeToken = null;

    async function handleEncryptAndSave() {
      const token = document.getElementById("setupToken").value.trim();
      const password = document.getElementById("setupPassword").value;
      const statusDiv = document.getElementById("setupStatus");

      if (!token || !password) {
        showStatus(statusDiv, "Please enter both token and password.", false);
        return;
      }

      try {
        const encryptedObject = await encryptData(token, password);
        // Save encrypted blob into localStorage
        localStorage.setItem("encrypted_github_token", JSON.stringify(encryptedObject));
        
        showStatus(statusDiv, "Success! Token encrypted and saved to localStorage.", true);
        document.getElementById("setupToken").value = "";
        document.getElementById("setupPassword").value = "";
      } catch (err) {
        showStatus(statusDiv, "Encryption failed: " + err.message, false);
      }
    }

    async function handleLoginAndTest() {
      const password = document.getElementById("loginPassword").value;
      const statusDiv = document.getElementById("loginStatus");
      const storedPayload = localStorage.getItem("encrypted_github_token");

      if (!storedPayload) {
        showStatus(statusDiv, "No encrypted token found. Complete Step 1 first.", false);
        return;
      }

      if (!password) {
        showStatus(statusDiv, "Please enter your password.", false);
        return;
      }

      try {
        const payload = JSON.parse(storedPayload);
        // Decrypt token into temporary local memory
        activeToken = await decryptData(payload, password);

        // Test the decrypted token with GitHub API
        const response = await fetch("https://api.github.com/user", {
          headers: {
            "Authorization": `Bearer ${activeToken}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (response.ok) {
          const userData = await response.json();
          showStatus(statusDiv, `Logged in successfully as GitHub user: <strong>${userData.login}</strong>`, true);
        } else {
          showStatus(statusDiv, "Decryption succeeded, but GitHub API returned status: " + response.status, false);
        }
      } catch (err) {
        showStatus(statusDiv, "Incorrect password or corrupted data.", false);
      }
    }

    function showStatus(element, text, isSuccess) {
      element.innerHTML = text;
      element.className = "status " + (isSuccess ? "success" : "error");
    }
  </script>
</body>
</html>
